name: debos-debian-xfs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check if GH_TOKEN is set
        run: |
          if [ "${{ secrets.GH_TOKEN }}" == '' ]
          then
            printf "secrets.GH_TOKEN is not set\n"
            exit 1
          fi

      - name: Pull image
        run: docker pull ghcr.io/go-debos/debos:latest

      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Bookworm
        run: docker run --rm --device /dev/kvm --user $(id -u) --workdir /recipes --mount "type=bind,source=$(pwd),destination=/recipes" --security-opt label=disable ghcr.io/go-debos/debos:latest debian-xfs.yaml

      - name: Bookworm cloud
        run: docker run --rm --device /dev/kvm --user $(id -u) --workdir /recipes --mount "type=bind,source=$(pwd),destination=/recipes" --security-opt label=disable ghcr.io/go-debos/debos:latest -t kernel:-cloud debian-xfs.yaml

      - name: Trixie
        run: docker run --rm --device /dev/kvm --user $(id -u) --workdir /recipes --mount "type=bind,source=$(pwd),destination=/recipes" --security-opt label=disable ghcr.io/go-debos/debos:latest -t suite:trixie debian-xfs.yaml

      - name: Trixie cloud
        run: docker run --rm --device /dev/kvm --user $(id -u) --workdir /recipes --mount "type=bind,source=$(pwd),destination=/recipes" --security-opt label=disable ghcr.io/go-debos/debos:latest -t kernel:-cloud -t suite:trixie debian-xfs.yaml
          

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release create "$(date -u +'%Y-%m-%dT%H-%M')" *.qcow2 --repo "aashipov/vm-images" --latest
