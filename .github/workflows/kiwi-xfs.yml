name: kiwi-xfs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check if GH_TOKEN is set
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]
          then
            printf 'secrets.GH_TOKEN is not set\n' >&2
            exit 1
          fi

      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Arch
        working-directory: kiwi-ng-arch
        run: docker compose up --build --abort-on-container-exit

      - name: Debian
        working-directory: kiwi-ng-debian
        run: |
          for profile in bookworm bookworm-cloud trixie trixie-cloud
          do
            echo "::group:: $profile begin"
            DISTRO=$profile docker compose up --build --abort-on-container-exit
            echo "::group:: $profile end"
          done

      - name: Alma9
        working-directory: kiwi-ng-alma9
        run: docker compose up --build --abort-on-container-exit

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: sudo GH_TOKEN="$GH_TOKEN" find . -type f -name '*.qcow2' -exec gh release create "$(date -u +%Y-%m-%dT%H-%M)" --repo aashipov/vm-images --latest {} +
