name: kiwi-xfs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check if GH_TOKEN is set
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]
          then
            printf 'secrets.GH_TOKEN is not set\n' >&2
            exit 1
          fi

      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Build Arch image
        working-directory: kiwi-ng-arch
        run: |
          docker build -t kiwi-arch .
          sudo rm -rf ./arch
          docker run --rm --privileged \
            -v /dev:/dev \
            -v "$(pwd)":/work \
            -v "$(pwd)/kiwi-cache":/var/cache/kiwi \
            kiwi-arch kiwi-ng --type=oem system build --description=/work/src --target-dir=/work/arch
          docker run --rm \
            -v "$(pwd)":/work \
            kiwi-arch qemu-img convert -O qcow2 -c -o compression_type=zstd /work/arch/archlinux.x86_64-xfs.qcow2 /work/archlinux-xfs.qcow2

      - name: Build Debian images
        working-directory: kiwi-ng-debian
        run: |
          docker build -t kiwi-debian .
          for profile in bookworm bookworm-cloud trixie trixie-cloud
          do
            echo "::group::Building $profile"
            sudo rm -rf "./${profile}"
            docker run --rm --privileged \
              -v /dev:/dev \
              -v "$(pwd)":/work \
              -v "$(pwd)/kiwi-cache":/var/cache/kiwi \
              kiwi-debian kiwi-ng --profile="${profile}" --type=oem system build --description=/work/src --target-dir="/work/${profile}"
            docker run --rm \
              -v "$(pwd)":/work \
              kiwi-debian qemu-img convert -O qcow2 -c -o compression_type=zstd "/work/${profile}/debian.x86_64-${profile}-xfs.qcow2" "/work/debian-${profile}-xfs.qcow2"
            echo "::endgroup::$profile"
          done

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: sudo GH_TOKEN="$GH_TOKEN" find . -type f -name '*.qcow2' -exec gh release create "$(date -u +%Y-%m-%dT%H-%M)" --repo aashipov/vm-images --latest {} +
