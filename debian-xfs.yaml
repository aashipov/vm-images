{{- $suite := or .suite "bookworm" -}}
{{- $kernel := or .kernel "" -}}
{{- $image := or .image (printf "debian-%s%s-xfs" $suite $kernel) -}}

architecture: amd64

actions:
  - action: debootstrap
    suite: {{ $suite }}
    components:
      - main
    variant: minbase
    #mirror: https://mirror.yandex.ru/debian

  - action: apt
    packages:
      {{- if eq $kernel "-cloud" }}
      - linux-image-cloud-amd64
      {{- else }}
      - linux-image-amd64
      - firmware-linux-free
      {{- end }}
      - xfsprogs
      - grub-efi-amd64
      - grub-pc-bin
      - cloud-init
      - cloud-guest-utils
      - openssh-server
      - sudo
      - curl
      - ca-certificates
      - zstd
      - network-manager
      - qemu-guest-agent

  - action: image-partition
    imagename: {{ $image }}.raw
    imagesize: 2GB
    partitiontype: gpt
    mountpoints:
      - mountpoint: /
        partition: root
      - mountpoint: /boot/efi
        partition: efi
        options: [ umask=0077 ]
    partitions:
      - name: bios
        fs: none
        start: 1MiB
        end: 2MiB
        flags: [ bios_grub ]
      - name: efi
        fs: fat32
        start: 2MiB
        end: 130MiB
        flags: [ esp ]
      - name: root
        fs: xfs
        start: 130MiB
        end: 100%

  - action: filesystem-deploy
    description: Deploy rootfs onto XFS partition

  - action: run
    chroot: true
    command: |
      # Enable essential services
      systemctl enable ssh NetworkManager qemu-guest-agent
      {{- if eq $suite "bookworm" }}
      systemctl enable cloud-init-local cloud-init cloud-config cloud-final
      {{- else }}
      systemctl enable cloud-init-main cloud-init-local cloud-init-network cloud-config cloud-final
      {{- end }}

      # Configure serial console for cloud/hypervisor visibility
      sed -i 's/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="console=tty0 console=ttyS0,115200n8"/' /etc/default/grub
      echo 'GRUB_TERMINAL="console serial"' >> /etc/default/grub
      echo 'GRUB_SERIAL_COMMAND="serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1"' >> /etc/default/grub

      # Install GRUB for both UEFI and Legacy BIOS
      ROOT_PART=$(findmnt -n -o SOURCE /)
      ROOT_DISK="/dev/$(lsblk -no PKNAME "${ROOT_PART}")"
      grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=debian --removable --no-nvram
      grub-install --target=i386-pc "${ROOT_DISK}"
      update-grub

      # Drop packages
      apt-get -y autoremove
      apt-get -y clean

      # Clean instance-specific state so cloud-init initializes fresh on first boot
      truncate -s 0 /etc/machine-id
      rm -f /var/lib/dbus/machine-id
      rm -f /etc/ssh/ssh_host_*
      cloud-init clean --logs


  - action: run
    postprocess: true
    command: |
      qemu-img convert -f raw -O qcow2 -c -o compression_type=zstd {{ $image }}.raw "{{ $image }}.qcow2"
      rm -f {{ $image }}.raw
